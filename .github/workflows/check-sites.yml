name: Website Change Monitor

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force check all sites immediately (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install chromium --with-deps

      - name: Run website monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            python monitor.py --force
          else
            python monitor.py
          fi

      - name: Save updated state and timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites.json state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update site check state [skip ci]"
            git pull --rebase -X ours origin main
            git push
          fi
